[metadata]
name = dj_waanverse_auth
author = Waanverse Labs Inc.
author_email = support@waanverse.com
maintainer = Khaotungkulmethee Pattawee
maintainer_email = tawee@waanverse.com
description = A comprehensive Waanverse Labs Inc. internal package for managing user accounts and authentication
long_description = file: README.md
long_description_content_type = text/markdown
license = Internal Use License
url = https://dj-waanverse-auth.waanverse.com/
keywords = django, user accounts, authentication, JWT, MFA
classifiers =
    Development Status :: 2 - Pre-Alpha
    Programming Language :: Python :: 3.11
    License :: Other/Proprietary License
    Natural Language :: English
    Operating System :: OS Independent
    Framework :: Django :: 5.1
    Environment :: Web Environment
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Communications :: Email
    Topic :: Security

project_urls =
    Documentation = https://dj-waanverse-auth.waanverse.com/
    Developers = https://www.waanverse.com
    Blog = https://www.waanverse.com/blog/

[options]
packages = find:
include_package_data = true
python_requires = >=3.11
install_requires =
    Django >=6, <7
    djangorestframework>=3, <4
    PyJWT>=2.14.0, <3
    mailersend>=2, <3
    cryptography>=50, <51
    phonenumbers >=9, <10
[options.packages.find]
exclude =
    demo
    tests
    tests.*

    # Exclude development configurations from being treated as Python packages
    .git
    .github

[sdist]
formats = gztar

[flake8]
max-line-length = 300
exclude =
    .git,
    __pycache__,
    .venv,
    env,
    build,
    dist,
    *.egg-info,
    */migrations/*,
    demo/db.sqlite3

# E203 (whitespace before ':') and W503 (line break before binary
# operator) conflict with how black formats code — safe to ignore
# even if this repo isn't running black yet, since flake8's own
# defaults on these two are widely considered wrong. F401 is NOT
# ignored here: an unused import in an auth package is worth catching,
# not silencing.
extend-ignore = E203, W503

per-file-ignores =
    # __init__.py files often import names purely to re-export them —
    # that's a deliberate unused-import, not a mistake.
    */__init__.py: F401
